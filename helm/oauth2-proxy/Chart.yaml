name: oauth2-proxy
version: 10.8.0
apiVersion: v2
appVersion: 7.15.3
home: https://oauth2-proxy.github.io/oauth2-proxy/
description: A reverse proxy that provides authentication with Google, Github or other providers
keywords:
  - kubernetes
  - oauth
  - oauth2
  - authentication
  - google
  - github
  - redis
dependencies:
  - name: redis-ha
    version: 4.35.10
    repository: https://dandydeveloper.github.io/charts
    condition: redis-ha.enabled
sources:
  - https://github.com/oauth2-proxy/oauth2-proxy
  - https://github.com/oauth2-proxy/manifests
maintainers:
  - name: pierluigilenoci
    email: pierluigi.lenoci@gmail.com
  - name: tuunit
    email: jan@larwig.com
  - name: JoelSpeed
    email: joel.speed@hotmail.co.uk
kubeVersion: ">=1.16.0-0"
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: Add alpha-config.source and alpha-config.name helpers for centralized alpha config resolution
      links:
        - name: GitHub PR
          url: https://github.com/oauth2-proxy/manifests/pull/405
    - kind: added
      description: Add deprecation guards for invalid alphaConfig combinations
      links:
        - name: GitHub PR
          url: https://github.com/oauth2-proxy/manifests/pull/405
    - kind: added
      description: Add 'tpl' usage for alphaConfig.existingSecret, alphaConfig.existingConfig, config.existingConfig, podAnnotations and podLabels
      links:
        - name: GitHub PR
          url: https://github.com/oauth2-proxy/manifests/pull/418
    - kind: added
      description: Add 'tpl' usage for sessionStorage.redis.existingSecret and sessionStorage.redis.sentinel.existingSecret
      links:
        - name: GitHub Issue
          url: https://github.com/oauth2-proxy/manifests/issues/409
        - name: GitHub PR
          url: https://github.com/oauth2-proxy/manifests/pull/418
